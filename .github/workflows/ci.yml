name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (whole repo)
        run: npx tsc --noEmit
      - name: Merge contract (R15/R16)
        run: npx tsx lib/import-review/merge-contract.test.ts
      - name: Paste-enrich contract (name on live + Google Maps)
        run: npx tsx lib/admin/paste-enrich-contract.test.ts
      - name: Display-name person→brand contract
        run: npx tsx lib/import-review/display-name-contract.test.ts
      - name: Professional categories contract
        run: npx tsx lib/professional/categories-contract.test.ts
      - name: Lint
        run: npx eslint . --quiet

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install python-dotenv
      - name: Compile all pipeline scripts
        run: |
          find scripts -name '*.py' -not -path '*/.venv/*' -print0 \
            | xargs -0 python3 -m py_compile
      - name: Contract & registry drift tests
        run: |
          python3 scripts/import-review/test_review_tags.py
          python3 scripts/import-review/test_extraction_contract.py
      - name: Pipeline unit tests
        run: |
          python3 scripts/import-review/test_category_map.py
          python3 scripts/import-review/test_eligibility.py
          python3 scripts/business-enrich/test_enrich_follow_policy.py
          python3 scripts/business-enrich/test_person_brand_name.py
          python3 scripts/facebook-collector/test_web_enrichment.py
